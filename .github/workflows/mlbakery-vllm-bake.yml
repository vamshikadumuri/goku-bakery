name: MLBakery vLLM Bake

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: 'vLLM version to install from PyPI (e.g. 0.30.0)'
        required: true
        default: '0.30.0'
  push:
    paths:
      - 'goku/mlbakery/vllm/**'
      - '.github/workflows/mlbakery-vllm-bake.yml'

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      packages: write
      contents: read
    env:
      VLLM_VERSION: ${{ inputs.vllm_version || '0.30.0' }}

    steps:
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push vLLM image
        uses: docker/build-push-action@v5
        with:
          context: goku/mlbakery/vllm
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VLLM_VERSION=${{ env.VLLM_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mlbakery:vllm-${{ env.VLLM_VERSION }}-cu130
            ghcr.io/${{ github.repository_owner }}/mlbakery:vllm-latest
